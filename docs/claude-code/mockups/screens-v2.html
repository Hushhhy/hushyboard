<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hushyboard · Écrans v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg-0: oklch(0.135 0.006 260); --bg: oklch(0.165 0.008 260); --s1: oklch(0.205 0.010 260); --s2: oklch(0.245 0.012 260); --s3: oklch(0.285 0.014 260); --s4: oklch(0.34 0.015 260);
  --line: oklch(0.30 0.012 260); --line-strong: oklch(0.58 0.015 260);
  --t1: oklch(0.955 0.006 85); --t2: oklch(0.81 0.010 260); --t3: oklch(0.70 0.012 260);
  --action: oklch(0.93 0.035 88); --on-action: oklch(0.18 0.010 260); --focus: oklch(0.93 0.010 260);
  --car: oklch(0.84 0.145 82); --car-d: oklch(0.32 0.06 82);
  --hab: oklch(0.82 0.12 190); --hab-d: oklch(0.30 0.05 190);
  --loi: oklch(0.76 0.15 345); --loi-d: oklch(0.30 0.07 345);
  --fin: oklch(0.76 0.11 280); --fin-d: oklch(0.33 0.06 280);
  --ok: oklch(0.82 0.14 150); --warn: oklch(0.80 0.125 60); --err: oklch(0.72 0.16 25); --info: oklch(0.80 0.09 240);
  --voile: oklch(0.10 0.005 260 / 0.55);
  --ui: "IBM Plex Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --display: "Bricolage Grotesque", "IBM Plex Sans", "Arial Narrow", system-ui, sans-serif;
  --sh-sup: inset 0 1px 0 oklch(1 0 0 / .07), 0 24px 48px -16px oklch(0 0 0 / .8);
}
*{box-sizing:border-box}
html{background:var(--bg-0)}
body{margin:0;background:var(--bg-0);color:var(--t1);font:400 16px/1.4 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#mock svg{width:18px;height:18px;flex:none}
.n{font-variant-numeric:tabular-nums slashed-zero}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.page{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:32px 64px;max-width:1360px;margin:0 auto}
.lede h1{font:750 clamp(28px,5vw,44px)/1.05 var(--display);letter-spacing:-.03em;margin:0 0 8px}
.lede p{color:var(--t2);margin:0 0 20px;max-width:70ch}
.picker{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.picker button{border:1px solid var(--line);background:var(--s1);color:var(--t2);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:500;cursor:pointer}
.picker button[aria-pressed="true"]{background:var(--s2);color:var(--t1);border-color:var(--line-strong);font-weight:600}
.picker .grp{width:100%;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600;margin-top:6px}
.mock{overflow-x:auto;border-radius:18px}
/* ---------- App ---------- */
.app{width:1280px;height:800px;display:grid;grid-template-columns:244px 1fr;background:var(--bg);border-radius:16px;overflow:hidden;position:relative;border:1px solid var(--line);font-size:14px}
.app.solo{grid-template-columns:1fr}
.side{background:var(--bg-0);padding:20px 12px 16px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font:750 20px/1 var(--display);letter-spacing:-.02em}
.nav-h{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--t3);padding:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--t2);text-decoration:none;position:relative;font-weight:500}
.nav-i svg{width:18px;height:18px;flex:none;color:var(--t3)}
.nav-i.on{background:var(--s2);color:var(--t1)}
.nav-i.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--t1)}
.nav-i.on svg{color:var(--t1)!important}
.nav-i .c{margin-left:auto;font-size:12px;color:var(--t3)}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--bg)}
.who .av{width:30px;height:30px;border-radius:8px;background:var(--car-d);color:var(--car);display:grid;place-items:center;font-weight:600}
.who small{display:block;color:var(--t3);font-size:12px}
.main{padding:20px 28px 24px;display:flex;flex-direction:column;gap:16px;min-width:0;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:16px;height:52px;flex:none}
.top .crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600;margin:0}
.top h2{font:700 24px/1.15 var(--display);letter-spacing:-.02em;margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .grow{flex:1;min-width:0}
.sample{font-size:12px;color:var(--t3);border:1px dashed var(--line-strong);border-radius:6px;padding:3px 8px;white-space:nowrap}
.cmdk{display:flex;align-items:center;gap:10px;width:300px;height:38px;padding:0 8px 0 12px;background:var(--s1);border:1px solid var(--line);border-radius:10px;color:var(--t3)}
.cmdk span{flex:1}
kbd{font:600 12px var(--ui);color:var(--t2);background:var(--s3);border-radius:5px;padding:2px 6px;border:1px solid var(--line)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex:none}
.tab{padding:8px 10px 10px;color:var(--t2);font-weight:500;position:relative}
.tab.on{color:var(--t1);font-weight:600}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--t1);border-radius:2px}
/* modules */
.mod{background:var(--s1);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.mod.focal{background:var(--s2);box-shadow:inset 0 1px 0 oklch(1 0 0 / .06),0 18px 40px -18px oklch(0 0 0 / .7)}
.mh{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--t3);margin:0}
.mh svg{width:16px;height:16px;flex:none}
.mh .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500}
.row{display:flex;gap:12px;min-height:0}
.col{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.f1{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14px;white-space:nowrap;cursor:pointer}
.btn-p{background:var(--action);color:var(--on-action)}
.btn-s{background:var(--s3);color:var(--t1);border-color:var(--line)}
.btn-q{background:none;color:var(--t2);padding:0 6px}
.btn-d{background:none;color:var(--err);border-color:var(--err)}
.btn-dp{background:var(--err);color:var(--on-action)}
.k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600}
.big{font-size:30px;line-height:1.1;font-weight:600;letter-spacing:-.01em}
.muted{color:var(--t2)} .faint{color:var(--t3)} .sm{font-size:12px} .b{font-weight:600}
.ruler{display:flex;gap:3px;height:8px}
.ruler i{flex:1;background:var(--bg-0);border-radius:2px;overflow:hidden;position:relative}
.ruler i b{position:absolute;inset:0 auto 0 0;border-radius:2px}
.track{height:10px;background:var(--bg-0);border-radius:2px;overflow:hidden;flex:1}
.track b{display:block;height:100%;border-radius:2px}
.chk{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line-strong);display:grid;place-items:center;flex:none}
.chk.done{background:var(--hab);border-color:var(--hab)}
.chk.done svg{color:var(--bg-0)}
.chk.pause{border-style:dashed;border-color:var(--t3);color:var(--t3)}
.chk svg{width:14px;height:14px}
.week{display:flex;gap:3px;align-items:flex-end;height:14px}
.week b{width:5px;height:12px;border-radius:2px;background:none;border:1px solid var(--line-strong)}
.week b.on{background:var(--hab);border-color:var(--hab)}
.week b.r{height:4px;background:var(--line-strong);border:0}
.week b.p{height:2px;background:var(--t3);border:0}
.week b.t{outline:1px solid var(--t3);outline-offset:1px}
.hrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:10px}
.hrow:hover{background:var(--s2)}
.tag{display:inline-flex;align-items:center;font-size:12px;color:var(--t2);background:var(--s2);border-radius:6px;padding:2px 8px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:6px;font-size:12px;font-weight:600;color:var(--t1);background:var(--s1);border:1px solid currentColor;white-space:nowrap}
.pill span{color:var(--t1)}
.pill svg{width:12px;height:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:var(--s1);color:var(--t2);font-weight:500;white-space:nowrap}
.chip.on{background:var(--s2);color:var(--t1);border:1px solid var(--line-strong);font-weight:600}
.chip small{color:var(--t3);font-size:12px}
.field{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px 0 12px;border-radius:8px;background:var(--bg-0);border:1px solid var(--line-strong);color:var(--t3)}
.field.filled{color:var(--t1)}
.lbl{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:4px;display:block}
table.t{width:100%;border-collapse:collapse;background:var(--s1);border-radius:14px;overflow:hidden}
.t th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.t td{padding:10px 14px;border-bottom:1px solid var(--line);color:var(--t2);white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}
.t td:first-child{color:var(--t1);font-weight:500}
.t tr.sel td{background:var(--s2)}
.cover{width:44px;height:64px;border-radius:4px;flex:none;display:flex;flex-direction:column;justify-content:space-between;padding:5px 4px;background:var(--loi-d);border:1px solid oklch(0.45 0.09 345);font:800 11px/.95 var(--display);color:var(--loi)}
.cover small{font:700 11px var(--ui);color:var(--t1)}
.cover.game{background:oklch(0.26 0.03 230);border-color:oklch(0.42 0.04 230);color:var(--t1)}
.cover.read{opacity:.55}
.empty{border:1px dashed var(--line-strong);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.err{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--err);background:oklch(0.72 0.16 25 / .08);border-radius:10px;padding:12px 14px}
.okbox{display:flex;gap:12px;align-items:center;border:1px solid var(--ok);border-radius:10px;padding:10px 14px}
.heat{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--bg-0);border:1px solid var(--line)}
.heat i.l1{background:var(--hab-d);border-color:var(--hab-d)}
.heat i.l2{background:oklch(0.50 0.08 190);border-color:transparent}
.heat i.l3{background:oklch(0.66 0.10 190);border-color:transparent}
.heat i.l4{background:var(--hab);border-color:transparent}
.heat i.rest{background:none;border:1px dashed var(--line)}
.scrim{position:absolute;inset:0;background:var(--voile);z-index:5}
.sheet{position:absolute;z-index:6;background:var(--s3);border-radius:16px;box-shadow:var(--sh-sup)}
.pal{left:482px;top:110px;width:560px;overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;border-bottom:1px solid var(--line);font-size:16px}
.pal-g{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600;padding:10px 16px 4px}
.pal ul{list-style:none;margin:0;padding:0 8px 8px}
.pal li{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;color:var(--t2)}
.pal li svg{width:16px;height:16px}
.pal li.on{background:var(--s4);color:var(--t1)}
.pal li .h{margin-left:auto;font-size:12px;color:var(--t2)}
.pal-f{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--t3)}
.panel{right:0;top:0;bottom:0;width:400px;border-radius:16px 0 0 16px;padding:20px;display:flex;flex-direction:column;gap:14px;z-index:6}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--line-strong);display:flex;flex-direction:column;gap:12px}
.tl li{position:relative;color:var(--t2)}
.tl li::before{content:"";position:absolute;left:-19px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--s3);border:1.5px solid var(--t2)}
.tl li.now::before{background:var(--t1);border-color:var(--t1)}
.toast{right:24px;top:84px;width:360px;padding:14px 16px;display:grid;grid-template-columns:52px 1fr;gap:12px}
.dialog{left:50%;top:50%;transform:translate(-50%,-50%);width:440px;padding:22px;display:flex;flex-direction:column;gap:12px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.dl dt{color:var(--t3)} .dl dd{margin:0;color:var(--t1)}
.note{color:var(--t3);font-size:12px}
.legal{max-width:68ch;overflow:auto;padding-right:8px}
.legal h3{font:700 18px/1.2 var(--ui);margin:18px 0 6px}
.legal p{color:var(--t2);margin:0 0 8px;font-size:14px}
.below{margin-top:12px;color:var(--t3);font-size:14px;max-width:80ch}
@media (max-width:640px){.picker button{font-size:13px}}
.mail{display:grid;grid-template-columns:214px 340px 1fr;gap:12px;flex:1;min-height:0}
.lbls{display:flex;flex-direction:column;gap:2px}
.lbl-i{white-space:nowrap;display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:8px;color:var(--t2);font-weight:500}
.lbl-i.on{background:var(--s2);color:var(--t1)}
.lbl-i i{width:8px;height:8px;border-radius:50%;flex:none}
.lbl-i .c{margin-left:auto;font-size:12px;color:var(--t3)}
.ml{display:flex;flex-direction:column;overflow:hidden;padding:6px}
.mi{display:grid;grid-template-columns:8px 1fr auto;gap:4px 10px;padding:10px;border-radius:10px;align-items:center}
.mi.on{background:var(--s2)}
.mi .dot{width:8px;height:8px;border-radius:50%;background:var(--info)}
.mi .from{font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.read .from{font-weight:500;color:var(--t2)}
.mi .d{font-size:12px;color:var(--t3)}
.mi .sub{grid-column:2/4;font-size:14px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi.read .sub{color:var(--t2)}
.mi .sn{grid-column:2/4;font-size:12px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .tg{grid-column:2/4;display:flex;gap:6px}
.reader{display:flex;flex-direction:column;gap:14px;overflow:hidden}
.reader .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.detect{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--car);background:oklch(0.84 0.145 82 / .07);border-radius:10px;padding:12px 14px}
.body{color:var(--t2);line-height:1.6;font-size:14px;max-width:62ch}
.body p{margin:0 0 10px}
.menu{position:absolute;z-index:6;background:var(--s3);border-radius:12px;box-shadow:var(--sh-sup);padding:6px;width:240px}
.menu li{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:8px;color:var(--t2);list-style:none}
.menu li.on{background:var(--s4);color:var(--t1)}
.menu ul{margin:0;padding:0}
.menu li i{width:8px;height:8px;border-radius:50%}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--t1);background:var(--s3);border-radius:6px;padding:3px 8px;white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%}
</style>

<div class="page">

<script>
const I=(id,c,s)=>`<svg style="${c?'color:var(--'+c+');':''}${s?'width:'+s+'px;height:'+s+'px':''}" aria-hidden="true"><use href="#${id}"/></svg>`;
const NAV=[['Accueil','i-home'],['Mails','i-mail','','12'],['h','Carrière','i-car','car'],['Profil','i-profil'],['CV','i-cv'],['Certifications','i-cert'],['Cours','i-cours'],['Recherches pro','i-search','','1'],['Analyses','i-ana'],['s'],['Habitudes & objectifs','i-hab','hab','2'],['h','Loisirs','i-loi','loi'],['Jeux vidéo','i-jeux'],['s'],['Finances','i-fin','fin']];
function side(on){return `<nav class="side" aria-label="Navigation principale"><div class="brand">${I('i-car','car',22)}Hushyboard</div>`+NAV.map(n=>{if(n[0]==='h')return `<div class="nav-h">${I(n[2],n[3],14)}${n[1]}</div>`; if(n[0]==='s')return '<div style="height:12px"></div>'; const [l,ic,col,c]=n; return `<a class="nav-i${l===on?' on':''}" href="#">${I(ic,col)}${l.replace('&','&amp;')}${c?`<span class="c n">${c}</span>`:''}</a>`;}).join('')+`<div class="who"><span class="av">A</span><span>Alex<small>acarpent · 42 Paris</small></span></div></nav>`;}
function topBar(crumb,title){return `<div class="top"><div class="grow"><p class="crumb">${crumb}</p><h2>${title}</h2></div><div class="cmdk">${I('i-search','',16)}<span>Cocher, ajouter, aller à…</span><kbd>⌘K</kbd></div></div>`;}
const tabs=(l,i)=>`<div class="tabs">${l.map((x,k)=>`<span class="tab${k===i?' on':''}">${x}</span>`).join('')}</div>`;
const st=(t,c)=>`<span class="st"><i style="background:var(--${c})"></i>${t}</span>`;
const app=(on,inner,extra='')=>`<div class="app">${side(on)}<main class="main">${inner}</main>${extra}</div>`;

/* ---------- Candidatures spontanées ---------- */
const SPONT=[['Doctolib','careers.doctolib.com','8 oct.','Full stack',st('Sans réponse','t3'),'<span style="color:var(--warn)" class="b">À relancer</span>'],
['Alan','alan.com/jobs','3 oct.','Full stack',st('Relancée','warn'),'17 oct.'],
['Qonto','qonto.com/careers','29 sept.','Full stack',st('Refus','err'),'—'],

['BlaBlaCar','blablacar.com/careers','10 oct.','Full stack',st('Sans réponse','t3'),'<span style="color:var(--warn)" class="b">À relancer</span>'],

  ${SPONT.map(r=>`<tr><td><div>${r[0]}</div><div class="sm faint" style="display:flex;gap:4px;align-items:center;font-weight:400">${I('i-link','t3',12)}${r[1]}</div></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td>${r[5]}</td></tr>`).join('')}

const labelsCol=(extra='')=>`<section class="mod" style="padding:12px 10px"><div class="lbls">${LBL.map(l=>`<div class="lbl-i${l[3]?' on':''}"><i style="background:var(--${l[1]})"></i>${l[0]}${l[2]?`<span class="c n">${l[2]}</span>`:''}</div>`).join('')}

const MAILS=[
 ['Nova Santé · Recrutement','Votre candidature au poste de développeur full stack','Bonjour Alexis, merci pour votre candidature. Nous aimerions…','10:42',[['Candidatures','car']],0,1],
 ['Welcome to the Jungle','12 nouvelles offres full stack pour vous','Développeur React/Node · Paris · CDI, Développeur…','09:15',[['Newsletters','info']],0,0],

const list=(sel=0)=>`<section class="mod ml"><div style="display:flex;align-items:center;gap:8px;padding:4px 6px 8px"><div class="field" style="flex:1;height:34px">${I('i-search','',16)}Rechercher dans les mails</div></div>${MAILS.map((m,k)=>`<div class="mi${k===sel?' on':''}${m[5]?' read':''}"><span class="dot" style="${m[5]?'visibility:hidden':''}"></span><span class="from">${m[0]}</span><span class="d">${m[3]}</span><span class="sub">${m[6]?I('i-ia','car',14)+' ':''}${m[1]}</span><span class="sn">${m[2]}</span>${m[4].length?`<span class="tg">${m[4].map(t=>st(t[0],t[1])).join('')}</span>`:''}</div>`).join('')}</section>`;

 <div><h3 style="margin:0 0 4px;font:600 20px/1.2 var(--ui)">Votre candidature au poste de développeur full stack</h3><div class="sm muted">Nova Santé · Recrutement &lt;jobs@nova-sante.fr&gt; · à moi</div></div>
 <div class="detect">${I('i-ia','car',18)}<div class="f1"><div class="b">Réponse à ta candidature « Développeur full stack junior · Nova Santé »</div><div class="sm muted" style="margin:2px 0 10px">Le mail parle d'un entretien. Mets à jour la candidature :</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-p">Marquer « Entretien RH »</button><button class="btn btn-s">Marquer « Refus »</button><button class="btn btn-q">Ignorer</button></div></div></div>
 <div class="body"><p>Bonjour Alexis,</p><p>Merci pour votre candidature au poste de développeur full stack junior. Votre parcours à l'École 42 a retenu notre attention et nous aimerions échanger avec vous lors d'un premier entretien de 30 minutes.</p><p>Pourriez-vous nous indiquer vos disponibilités pour la semaine prochaine ?</p><p>Bien cordialement,<br>Camille, équipe recrutement</p></div>
</section>`;
const readerNews=`<section class="mod reader">
 <div class="bar"><button class="btn btn-s">${I('i-tag','',16)}Ranger dans…</button><button class="btn btn-d">${I('i-unsub','',16)}Se désabonner</button><button class="btn btn-q">${I('i-link','',16)}Ouvrir dans Gmail</button><span style="flex:1"></span><span class="sm faint">09:15 · 22 oct.</span></div>
 <div><h3 style="margin:0 0 4px;font:600 20px/1.2 var(--ui)">12 nouvelles offres full stack pour vous</h3><div class="sm muted">Welcome to the Jungle &lt;alertes@welcometothejungle.com&gt; · à moi</div></div>
 <div class="body"><p>Bonjour Alexis,</p><p>Voici les offres qui correspondent à votre alerte « développeur full stack · Paris ».</p><p><b style="color:var(--t1)">Développeur React / Node.js</b> · Paris · CDI<br><b style="color:var(--t1)">Développeur full stack junior</b> · Lyon · CDI<br><b style="color:var(--t1)">Alternance développeur web</b> · Lille · 24 mois</p><p class="sm faint">Vous recevez ce mail car vous êtes inscrit aux alertes emploi.</p></div>
</section>`;
const mailScreen=(sel,reader,extra='',lblExtra='')=>app('Mails', topBar('Mails · Gmail','12 non lus, 1 réponse de recruteur à valider.')+`<div class="mail">${labelsCol(lblExtra)}${list(sel)}${reader}</div>`, extra);
const MENU=`<div class="menu" style="left:880px;top:150px"><ul>${[['Candidatures','car',1],['Newsletters','info'],['École 42','hab'],['Finances','fin']].map(l=>`<li class="${l[2]?'on':''}"><i style="background:var(--${l[1]})"></i>${l[0]}${l[2]?`<span style="margin-left:auto">${I('i-check','',14)}</span>`:''}</li>`).join('')}<li style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px">${I('i-plus','t3',16)}Nouveau libellé…</li></ul></div>`;
const NEWLBL=`<div class="scrim"></div><div class="sheet dialog"><h3 style="margin:0;font:700 20px var(--display)">Nouveau libellé</h3><div><label class="lbl">Nom</label><div class="field filled">Entretiens</div></div><div><span class="lbl">Couleur</span><div style="display:flex;gap:8px">${['car','info','hab','fin','loi','warn'].map((c,k)=>`<span style="width:24px;height:24px;border-radius:6px;background:var(--${c});${k===0?'outline:2px solid var(--t1);outline-offset:2px':''}"></span>`).join('')}</div></div><p class="note" style="margin:0">Le libellé est créé aussi dans Gmail.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-q">Annuler</button><button class="btn btn-p">Créer</button></div></div>`;

const S=[
 {g:'Recherches pro',l:'Candidatures spontanées',html:spont,note:'Nouvel onglet de Recherches pro. Une ligne par site carrière où tu as envoyé une candidature spontanée.'},
 {g:'Mails',l:'Réponse de recruteur détectée',html:mailScreen(0,readerApp),note:'Le mail vient d\'une entreprise où tu as postulé : le bandeau propose de mettre à jour la candidature, tu valides en 1 clic.'},
 {l:'Newsletter + désabonnement',html:mailScreen(1,readerNews),note:'« Se désabonner » utilise l\'en-tête List-Unsubscribe du mail, puis propose d\'archiver les anciens.'},
 {l:'Ranger dans un libellé',html:mailScreen(0,readerApp,MENU),note:'Les libellés sont ceux de Gmail : ranger ici range aussi dans Gmail.'},
 {l:'Créer un libellé',html:mailScreen(0,readerApp,NEWLBL),note:'Création d\'un libellé, synchronisé avec Gmail.'},
];
const picker=document.getElementById('picker'),mock=document.getElementById('mock'),note=document.getElementById('note');
let lastG='';S.forEach((s,i)=>{if(s.g&&s.g!==lastG){lastG=s.g;picker.insertAdjacentHTML('beforeend',`<span class="grp">${s.g}</span>`);}const b=document.createElement('button');b.type='button';b.textContent=s.l;b.addEventListener('click',()=>show(i));picker.appendChild(b);});
function show(i){[...picker.querySelectorAll('button')].forEach((b,k)=>b.setAttribute('aria-pressed',String(k===i)));mock.innerHTML=S[i].html;note.textContent=S[i].note||'';}
show(0);
</script>
